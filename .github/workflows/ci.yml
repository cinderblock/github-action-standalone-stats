name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test --timeout 30000 --reporter=junit --reporter-outfile=junit.xml --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Build bundle (sanity-check that source compiles)
        run: bun run build

      # Dogfood: this repo's own results and coverage, through the committed
      # bundle. One flag per OS, so coverage is broken down by platform.
      - name: Collect test results and coverage
        if: ${{ !cancelled() }}
        uses: ./collect
        with:
          tests: junit.xml
          coverage: coverage/lcov.info
          flags: ${{ runner.os }}

  # Fan-in: merge every job's results, record master's history on gh-pages,
  # and write the job summary. PRs (forks too) only get a comparison.
  stats:
    needs: [test, dashboard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    # No `concurrency` group on purpose: a newly queued job cancels any job
    # already pending in its group, which would drop runs' stats. The action
    # retries lost push races itself.
    steps:
      - uses: actions/checkout@v7
      - name: Publish stats
        id: stats
        uses: ./
        with:
          # Dogfood the harder path: hand the PR comment and statuses to the
          # companion (the `comment` job below; stats-comment.yml for forks)
          # instead of posting them from here.
          comment: artifact
          thresholds: |
            total: 80
            patch: 60
            drop: 2
      - run: echo "Dashboard ${{ steps.stats.outputs.site-url }} (recorded ${{ steps.stats.outputs.recorded }}, thresholds passed ${{ steps.stats.outputs.thresholds-passed }})"

  # The companion, run in the same workflow for same-repo PRs and pushes:
  # posts the sticky PR comment and the coverage statuses from the report
  # the stats job uploaded. Fork PRs get the same from stats-comment.yml,
  # which runs with this repo's token after this workflow finishes.
  comment:
    needs: stats
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Post PR comment and statuses
        id: comment
        uses: ./comment
        with:
          run-id: ${{ github.run_id }}
      - run: echo "Comment ${{ steps.comment.outputs.comment-url }} (thresholds passed ${{ steps.comment.outputs.thresholds-passed }})"

  # The dashboard, end to end: build it, generate the demo data through the
  # real pipeline, and drive every page in headless Chromium (desktop and
  # phone sizes).
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - name: Collect results
        if: ${{ !cancelled() }}
        uses: ./collect
        with:
          tests: e2e-junit.xml
          flags: dashboard

  # Load the committed bundles the way the runner does, and assert they get
  # past module loading into the action's own environment guard. Catches
  # module-format / runtime breaks that lint/test/build never exercise.
  bundle-loads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bundles load and reach the env guard
        run: |
          set +e
          for entry in dist/publish/main.js dist/collect/main.js dist/comment/main.js; do
            env -u GITHUB_REPOSITORY node "$entry" > out.txt 2>&1
            cat out.txt
            grep -q "only runs inside GitHub Actions" out.txt || { echo "::error::$entry did not load"; exit 1; }
          done
