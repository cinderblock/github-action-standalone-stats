# https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax

name: Standalone Stats
description: >-
  Self-hosted test and coverage stats: merges results from every job in a
  run (Codecov-style, with flags, components, carryforward and patch
  coverage), keeps history on a branch of your repo, and publishes a
  dashboard and badges with GitHub Pages. No third-party service.
author: Cameron Tacklind <cameron@tacklind.com>
branding:
  icon: bar-chart-2
  color: blue

inputs:
  # ---- What to publish ----
  tests:
    description: >-
      Test result files or directories (globs, one per line) to read in this
      job, for single-job workflows. JUnit XML, CTRF JSON and Allure results
      are detected automatically. In a matrix, run the `collect` action in
      each job instead and leave this empty.
    default: ''
  test-format:
    description: Force a format for `tests` (junit, ctrf, allure). Default auto.
    default: auto
  coverage:
    description: >-
      Coverage reports (globs, one per line) to read in this job, for
      single-job workflows. lcov and Cobertura XML are detected
      automatically. In a matrix, give them to `collect` instead.
    default: ''
  coverage-format:
    description: Force a format for `coverage` (lcov, cobertura). Default auto.
    default: auto
  flags:
    description: Labels for the results and coverage read via `tests`/`coverage` (comma or newline separated).
    default: ''
  id:
    description: Extra identity for the results read via `tests`, if this job publishes more than one set.
    default: ''
  matrix:
    description: Matrix values of this job. Leave the default.
    default: ${{ toJSON(matrix) }}
  download-artifacts:
    description: Merge in the uploads that `collect` steps made earlier in this run.
    default: 'true'
  artifact-prefix:
    description: Artifact name prefix shared with `collect`.
    default: standalone-stats-

  # ---- Coverage ----
  components:
    description: >-
      Named groups of files, one `Name: glob, glob` per line (`**` crosses
      directories; a glob without `/` matches file names anywhere). A file
      can be in several. Default: one component per language.
    default: ''
  carryforward:
    description: >-
      Flags whose coverage is carried forward from the baseline when no job
      in this run uploaded them: flag names, or `true` for every flag.
    default: 'false'
  patch-coverage:
    description: >-
      Report coverage of the lines a PR (or push) changed, using the compare
      API.
    default: 'true'
  detail-window:
    description: Runs whose line-level coverage is kept (older runs keep totals only).
    default: '50'

  # ---- Pull requests and checks ----
  comment:
    description: >-
      PR comment, one per workflow, edited in place on every push. `auto`
      posts it when the token can (needs `pull-requests: write`) and
      otherwise hands the report to the `comment` companion action as an
      artifact, as it always does for fork PRs. `artifact` always hands off.
      `never` turns it off.
    default: auto
  thresholds:
    description: >-
      Coverage rules, one `name: number` per line. `total`, `branches` and
      `patch` are minimum percentages, `drop` is the most points total
      coverage may fall below the baseline, and `component <name>` /
      `flag <name>` are minimum line coverage. Off when empty.
    default: ''
  threshold-status:
    description: >-
      Report thresholds as commit statuses (`standalone-stats/coverage` and
      `standalone-stats/patch`; needs `statuses: write`), which branch
      protection can require.
    default: 'true'
  fail-on-threshold:
    description: Fail this step when a threshold isn't met.
    default: 'false'

  # ---- Where ----
  repo:
    description: >-
      Repository (`owner/name`) holding the stats branch. Default: this repo.
      Another repo needs a `token` that can push to it.
    default: ''
  branch:
    description: Branch holding stats data, viewer and badges.
    default: gh-pages
  path:
    description: >-
      Directory inside the branch. Default `stats`, or `<owner>/<repo>/stats`
      when `repo` is another repository.
    default: ''
  token:
    description: Token used to read and push the stats branch.
    default: ${{ github.token }}

  # ---- Behavior ----
  record:
    description: >-
      `auto` stores runs from pushes, schedules and manual runs on the default
      branch; other runs (PRs) are compared against it but not stored.
      `always` or `never` override.
    default: auto
  history-window:
    description: Runs kept in the per-test history (flaky and slow tests).
    default: '30'
  viewer:
    description: Copy the dashboard into the stats directory.
    default: 'true'
  allow-public-pages-for-private-repo:
    description: >-
      Publish even though the stats repo is private and its public Pages site
      serves the stats branch, making test names and messages public.
    default: 'false'
  fail-on-test-failure:
    description: Fail this step when any test failed.
    default: 'false'
  push-attempts:
    description: Attempts to push when another run pushed to the stats branch first.
    default: '6'

  # ---- Separate stats repo ----
  create-repo:
    description: Create `repo` if it doesn't exist (the token needs permission to create repos).
    default: 'false'
  repo-visibility:
    description: Visibility of a repo created by `create-repo` (public or private).
    default: public

  # ---- Commits ----
  commit-name:
    description: Git user.name for stats commits.
    default: github-actions[bot]
  commit-email:
    description: Git user.email for stats commits.
    default: 41898282+github-actions[bot]@users.noreply.github.com
  commit-message:
    description: Commit message. Default names the repo, commit and run.
    default: ''

outputs:
  site-url:
    description: URL of the stats dashboard.
  badge-url:
    description: URL of the tests badge.
  badge-markdown:
    description: Markdown for a README badge linking to the dashboard.
  site-dir:
    description: >-
      Local copy of the published stats directory, for deploying with
      actions/upload-pages-artifact. Only set when the run was recorded.
  recorded:
    description: '`true` if this run was stored in history.'
  run-key:
    description: Key of this run in the data (`<run id>-<attempt>`).
  tests-total:
    description: Test results in this run (summed over jobs).
  tests-passed:
    description: Passed results.
  tests-failed:
    description: Failed or errored results.
  tests-skipped:
    description: Skipped results.
  new-failures:
    description: Tests failing now that weren't failing in the baseline run.
  coverage-lines:
    description: Line coverage, percent with two decimals (empty without coverage).
  coverage-branches:
    description: Branch coverage, percent (empty without branch data).
  coverage-patch:
    description: Patch coverage, percent (empty when not computed or nothing coverable changed).
  coverage-badge-url:
    description: URL of the coverage badge (empty without coverage).
  coverage-badge-markdown:
    description: Markdown for a README coverage badge.
  thresholds-passed:
    description: '`true` or `false` when there were thresholds to check, else empty.'
  comment-url:
    description: URL of the PR comment, when this step posted or updated it.

runs:
  using: node24
  main: dist/publish/main.js
